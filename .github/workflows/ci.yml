name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Byte-compile the package
        run: python -m compileall visioncount

      - name: Run the OpenCV pipeline on a synthetic clip (smoke test)
        run: python -m visioncount --source synthetic --frames 120 --no-window --json

      - name: Verify the Flask app imports
        run: python -c "import visioncount.app as a; assert hasattr(a, 'app'); print('flask app OK')"

      - name: Run tests with coverage (gate at 80%)
        run: pytest -q --cov=visioncount --cov-report=term-missing --cov-fail-under=80

  demo-artifacts:
    name: demo artifacts (frames + gif + report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Regenerate demo images + looping GIF
        run: python examples/generate_demo.py --gif
      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visioncount-demo
          path: |
            docs/demo_frame.png
            docs/demo_heatmap.png
            docs/demo_report.png
            docs/demo.gif

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check visioncount tests
