[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visioncount"
version = "0.1.0"
description = "Real-time object counting & line-crossing analytics with OpenCV + Flask"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xj16" }]
keywords = [
    "opencv",
    "computer-vision",
    "object-counting",
    "line-crossing",
    "tracking",
    "heatmap",
    "flask",
    "raspberry-pi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.26,<3",
    "Flask>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]
dev = ["pytest>=8.0"]

[project.scripts]
visioncount = "visioncount.cli:main"

[project.urls]
Homepage = "https://github.com/xj16/visioncount"
Repository = "https://github.com/xj16/visioncount"
Issues = "https://github.com/xj16/visioncount/issues"

[tool.setuptools]
packages = ["visioncount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
